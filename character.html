<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderer Character Sheet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f1e8;
      color: #333;
    }
    
    .container {
      background: #f5f1e8;
      padding: 3rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header h1 {
      font-size: 54px;
      font-weight: 700;
      letter-spacing: 3px;
      margin: 0;
    }

    .header p {
      font-size: 14px;
      letter-spacing: 2px;
      margin: 0.5rem 0 0 0;
      color: #666;
    }

    .top-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      margin-bottom: 3rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.6rem;
    }

    .form-group input {
      padding: 0.9rem;
      border: 1px solid #999;
      font-size: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: rgba(255, 255, 255, 0.7);
    }

    .form-group input:focus {
      outline: none;
      background: #fff;
      border-color: #333;
    }

    .form-section {
      margin-bottom: 3rem;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      border-bottom: 2px solid #000;
      padding-bottom: 1rem;
      margin-bottom: 1.8rem;
      letter-spacing: 1px;
    }

    .attributes {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .attr-box {
      border: 1px solid #999;
      padding: 1.5rem;
      text-align: center;
    }

    .attr-label {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.8rem;
    }

    .attr-input {
      font-size: 28px;
      text-align: center;
      padding: 0.8rem;
      border: none;
      background: transparent;
      font-weight: 700;
      width: 100%;
    }

    .trouble-gambit {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      margin-bottom: 3rem;
    }

    .trouble-box, .gambit-box {
      border: 1px solid #999;
      padding: 1.8rem;
    }

    .trouble-gambit-label {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.8rem;
    }

    .trouble-gambit-input {
      padding: 0.8rem;
      border: 1px solid #999;
      font-size: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: rgba(255, 255, 255, 0.7);
      width: 100%;
    }

    .trouble-gambit-input:focus {
      outline: none;
      background: #fff;
      border-color: #333;
    }

    .journal-section {
      background: white;
      border: 1px solid #999;
      padding: 2rem;
      border-radius: 6px;
    }

    .journal-label {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 1.2rem;
    }

    .journal-textarea {
      width: 100%;
      min-height: 800px;
      padding: 1.5rem;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      border: 1px solid #999;
      border-radius: 4px;
      resize: vertical;
      line-height: 1.6;
    }

    .journal-textarea:focus {
      outline: none;
      border-color: #333;
      background: #fff;
    }

    .print-button {
      padding: 0.8rem 2rem;
      background: #333;
      color: #f5f1e8;
      border: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 6px;
      margin-top: 2rem;
    }

    .print-button:hover {
      background: #555;
    }

    .action-buttons {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>WANDERER</h1>
      <p>Solo Adventure & Discovery</p>
    </div>

    <div class="top-section">
      <div class="form-group">
        <label>Player Name</label>
        <input type="text" placeholder="">
      </div>
      <div class="form-group">
        <label>Character Name</label>
        <input type="text" placeholder="">
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Attributes</div>
      <div class="attributes">
        <div class="attr-box">
          <div class="attr-label">Heart</div>
          <input type="text" class="attr-input" maxlength="2">
        </div>
        <div class="attr-box">
          <div class="attr-label">Blues</div>
          <input type="text" class="attr-input" maxlength="2">
        </div>
        <div class="attr-box">
          <div class="attr-label">Muscle</div>
          <input type="text" class="attr-input" maxlength="2">
        </div>
        <div class="attr-box">
          <div class="attr-label">Grit</div>
          <input type="text" class="attr-input" maxlength="2">
        </div>
        <div class="attr-box">
          <div class="attr-label">Savvy</div>
          <input type="text" class="attr-input" maxlength="2">
        </div>
      </div>
    </div>

    <div class="trouble-gambit">
      <div class="trouble-box">
        <div class="trouble-gambit-label">Trouble</div>
        <textarea class="trouble-gambit-input" style="min-height: 120px; resize: vertical;"></textarea>
      </div>
      <div class="gambit-box">
        <div class="trouble-gambit-label">Gambit</div>
        <textarea class="trouble-gambit-input" style="min-height: 120px; resize: vertical;"></textarea>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Journal & Adventure Log</div>
      <div class="journal-section">
        <textarea class="journal-textarea" id="journalText" placeholder="Record your solo adventures, encounters, discoveries, and inner thoughts here. Your journal is the heart of your wandering story..."></textarea>
      </div>
    </div>

    <div class="action-buttons">
      <button class="print-button" onclick="window.print()">Print Sheet</button>
    </div>
  </div>

  <script>
    // Load journal from localStorage
    window.addEventListener('DOMContentLoaded', function() {
      const savedJournal = localStorage.getItem('wandererJournal');
      if (savedJournal) {
        document.getElementById('journalText').value = savedJournal;
      }
    });

    // Auto-save journal
    document.addEventListener('DOMContentLoaded', function() {
      const journalText = document.getElementById('journalText');
      if (journalText) {
        journalText.addEventListener('input', function() {
          localStorage.setItem('wandererJournal', this.value);
        });
      }
    });
  </script>
</body>
</html>
