<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Blues — Gambits & Troubles</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f9f8f5; color: #1a1a1a; padding: 1.5rem; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 1.25rem; color: #1a1a1a; }
.tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.tab { padding: 6px 18px; border-radius: 8px; border: 0.5px solid #ccc; background: transparent; cursor: pointer; font-size: 14px; color: #666; transition: all 0.15s; }
.tab.active { background: #efefef; color: #1a1a1a; font-weight: 500; border-color: #aaa; }
.search { width: 100%; padding: 8px 12px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #1a1a1a; font-size: 14px; margin-bottom: 1.25rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.card { background: #fff; border: 0.5px solid #e0e0dc; border-radius: 12px; padding: 14px 16px; }
.card:hover { border-color: #bbb; }
.card-name { font-size: 15px; font-weight: 500; color: #1a1a1a; margin-bottom: 6px; }
.card-body { font-size: 13px; color: #555; line-height: 1.55; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; margin-bottom: 8px; }
.tag-gambit { background: #dbeafe; color: #1e40af; }
.tag-trouble { background: #fef3c7; color: #92400e; }
.none { color: #aaa; font-size: 14px; padding: 2rem 0; }
.trigger { font-size: 12px; color: #999; margin-top: 8px; border-top: 0.5px solid #e8e8e4; padding-top: 8px; }
.count { font-size: 13px; color: #999; margin-bottom: 1rem; }
</style>
</head>
<body>
<h1>Orbital Blues — Gambits &amp; Troubles</h1>
<div class="tabs">
  <button class="tab active" onclick="setTab('all')">All</button>
  <button class="tab" onclick="setTab('gambit')">Gambits</button>
  <button class="tab" onclick="setTab('trouble')">Troubles</button>
</div>
<input class="search" type="text" placeholder="Search by name or keyword..." oninput="render()" id="search" />
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script>
const DATA = [
  { type:'gambit', name:'A Fighter, Not a Lover', desc:'No one can match you in a fight, the heat is everything. Spend Exertion during Combat instead of rolling a Stat Check. If successful, you do not spend Heart.' },
  { type:'gambit', name:'Ace Pilot', desc:'You\'ve never met anyone who could match you behind the wheel. When piloting a Vehicle, you can always use Savvy instead of Mobility for Stat Checks. You can also choose one option instead of two when you roll a success.' },
  { type:'gambit', name:'The Bandit', desc:'Through natural ability or training, you are more with incredible agility when you use Exertion to reroll a die while performing physical feats of dexterity, thievery, or agility. You may reroll up to two dice per Heart spent, instead of one.' },
  { type:'gambit', name:'Beast', desc:'You are very intimidating. If not in combat, including but not limited to acting with something to prove, you roll with the Upper Hand against those with Against the Odds against the cowardly.' },
  { type:'gambit', name:'Beauty', desc:'You are attractive by any measure, if not always in the conventional sense. You roll with the Upper Hand on checks to influence the smitten, or Against the Odds against the envious.' },
  { type:'gambit', name:'Book Learning', desc:'You are an academic or special interest field. This could be anything from theoretical physics or biology to literature or history. You roll with the Upper Hand on all Stat Checks relating to knowledge in your field or specialisation.' },
  { type:'gambit', name:'The Captain', desc:'You lead your crew through thick and thin, and they\'ll always trust you. Once per Scene, when you order one of your Crew to do something, they roll with the Upper Hand to do it. If they fail, you may reroll with the Upper Hand on a Stat Check.' },
  { type:'gambit', name:'Desperado', desc:'You can push yourself to the limit when it matters. You can use Exertion to reroll a die in combat. When you use Exertion, you may reroll up to two dice per Heart spent, instead of one.' },
  { type:'gambit', name:'Devil\'s Right Hand', desc:'A pistol is as much a weapon as it is an extension of your will. You always roll with the Upper Hand when Attacking with pistols, and never roll Against the Odds.' },
  { type:'gambit', name:'Engineer', desc:'You\'re always creating and designing new technological advancements. Design a new piece of Crew Equipment with the Storyteller. You own it or have it installed on your ship. At the end of each Session, allocate an additional die to a Crew Project.' },
  { type:'gambit', name:'Fast Hands', desc:'You\'re the fastest gun in the Frontier Galaxy. When your initiative is Surprised, you can still act and add the higher to your Savvy. You may roll 2d3 instead and add the higher to your Savvy on your first Turn.' },
  { type:'gambit', name:'Friends in Low Places', desc:'You\'re known more than a few shady times. When you return to an old haunt and seek some old friends, roll a Blues Check. If you succeed, in addition to gaining a Blues Check, roll with the Upper Hand on your next check to obtain or coerce something from someone there.' },
  { type:'gambit', name:'The Gambler', desc:'You are a master of misdirection. It comes as easily as breathing. When you use Exertion to reroll a die while gambling or bluffing, you may reroll up to two dice per Heart spent, instead of one.' },
  { type:'gambit', name:'Gift of the Gab', desc:'You can compose yourself to spin a social situation. When you use Exertion, you may reroll up to two dice per Heart spent, instead of one. You can utilise your knowledge and abilities lying and constructing truths.' },
  { type:'gambit', name:'Grease-Monkey', desc:'You can utilise your knowledge and abilities to perform engineering tasks others find impossible. When you use Exertion to complete engineering tasks others find impossible, you may reroll up to two dice per Heart spent, instead of one.' },
  { type:'gambit', name:'Hail of Blows', desc:'You can pummel your enemies into submission. When making an Attack Against the Odds, you can spend 1 Heart to make a second Attack Against the Odds with some weapon this turn.' },
  { type:'gambit', name:'Heard It Through the Grapevine', desc:'The buzz is everything and everyone. Once per Session, roll a Savvy Check to discover the Crew\'s current predicament. You roll with the Upper Hand on all Stat Checks to gather information or obtain something advantageous about the situation.' },
  { type:'gambit', name:'Heart of Gold', desc:'You are known for your honesty and good nature. When you speak, roll with the Upper Hand to persuade people to believe you, or to lead them to believe you, even with your heart.' },
  { type:'gambit', name:'It\'s All in the Details', desc:'You notice all manner of things others might not. You roll with the Upper Hand on all Observation Checks. Once per Session, the Storyteller tells you what parts you need to fix it and how long it will take.' },
  { type:'gambit', name:'Just Nuts and Bolts', desc:'You are a mechanical wizard. When you come across a broken piece of technology, the Storyteller tells you what parts you need to fix it and how long it will take.' },
  { type:'gambit', name:'Light-Fingered', desc:'Through years on one side of the law or the other, you\'ve learnt your way around. You have the Upper Hand on Observation Checks to notice and identify locks, traps and other security measures, as well as Stat Checks to disable them.' },
  { type:'gambit', name:'Lucky', desc:'Luck smiles down on you. Once per Arc, you can force yourself or any other character to reroll a single Check with either the Upper Hand or Against the Odds and choose either result.' },
  { type:'gambit', name:'Marksman', desc:'With enough time, you can make one shot count. You can take a turn to line up a shot, examining a target and its movement, then Attack with the Upper Hand using a Ranged Personal or Military weapon. The Storyteller may allow use of Marksman\'s Aim before combat starts.' },
  { type:'gambit', name:'Martial Art', desc:'You are skilled in unarmed combat. You always come to a fight unarmed. You do not roll Against the Odds when you Attack, and your unarmed attacks reflect a tighter style. To reflect Defensive, Intimidating, or Tactile style, grant your opponent the Upper Hand on Healing Checks.' },
  { type:'gambit', name:'Sawbones', desc:'You\'re a skilled medical doctor. You always come prepared, having the Upper Hand on all Stat Checks related to medicine. In addition, at the end of each Session you need to recover Heart. Roll Against its Odds if you need to recover Heart for this.' },
  { type:'gambit', name:'Side Hustle', desc:'You have another job or enterprise bringing an Interstellar income. At the end of each Session when calculating Credits and Debts, you can add the result to either the player\'s Credits or to your Savings. Tell the others what you do to make ends meet.' },
  { type:'gambit', name:'Technical Expert', desc:'You have the gift of a specialty. You can always use your Grit or Savvy instead of a speciality. You can spend a point of Heart to negotiate a Vehicle. You can always use Checks to operate a Vehicle, and can sometimes do things that are not in a normal job.' },
  { type:'gambit', name:'The Perfect Lie', desc:'There you will sometimes believe at the risk of a straight lie. Once per Session, you can perfectly convince someone of a lie. They will always believe it to be true for the rest of the Scene or combat.' },
  { type:'gambit', name:'Thick Pockets', desc:'You always count as connected to where your recent work of Credits comes from. You can add the result to either the other characters\' Credits or to your Savings when calculating Credits and Debts.' },
  { type:'gambit', name:'Tooled Up', desc:'You have all the tops. Choose two: gain one of your weapons on your ship, gain an additional piece of Crew Equipment, can use of your weapons on board a qualified final, take on an extra weapon, add a weapon to your ship.' },
  { type:'gambit', name:'True Grit', desc:'You\'ve got real guts. Once per Session, you may draw on your inner resolve to roll a Stat Check or Attack with the Upper Hand using your Grit instead of a normal Stat. Bullets, braces and twists aren\'t enough to slow you down.' },
  { type:'gambit', name:'Unstoppable', desc:'Bullets, braces and twists aren\'t enough to slow you down. Stacked with only not damage from an Attack, this negates all incoming damage. Once per Arc you may choose to take only not damage from an Attack\'s Brewing damage.' },
  { type:'gambit', name:'Well-Travelled', desc:'You\'ve seen almost every spaceport in the Frontier Galaxy. Once per Arc when you arrive on a new planet, city or spaceport, you can announce that you have been here before, tell the group about a contact or location you know well. Gain a Blues.' },
  { type:'gambit', name:'Wheels', desc:'You own a sweet ride. Treat it as a Small Vehicle with total Stats of 2. It has no integrated equipment for now. Your Crew Ship has a hangar bay to accommodate it.' },

  { type:'trouble', name:'Best Served Cold', desc:'They crossed you, and they\'ll regret it.', triggers: ['You remember what it cost you', 'You escalate a situation in an attempt to get revenge', 'You cross the one line you always swore you wouldn\'t'] },
  { type:'trouble', name:'Bloodthirsty', desc:'The best way to end a fight is to be more willing to commit spectacular violence than your enemies.', triggers: ['You answer one of the questions during play', 'You answer with your brutality'] },
  { type:'trouble', name:'Brick in the Wall', desc:'You\'re not just a criminal, well-functioning person. No paranoia. Nothing. How did you end up here?', triggers: ['Someone takes advantage of your good nature', 'Someone hurts you when they find you unremarkable', 'Something that a normal outlaw wouldn\'t find remarkable'] },
  { type:'trouble', name:'Close to Your Chest', desc:'You have come into information that is incredibly dangerous, highly sought after or scandalous. You know something you definitely shouldn\'t know.', triggers: ['You keep your secret, to the detriment of others', 'You selfishly hold your tongue', 'Keeping your secret negatively affects your daily life'] },
  { type:'trouble', name:'Devil in the Bottle', desc:'You tell your friends you\'re high functioning. You ain\'t.', triggers: ['You do something stupid while drunk that reminds you of that other time', 'You go cold turkey for more than a day or two', 'You wrestle with the consequences of a hangover'] },
  { type:'trouble', name:'A Higher Cause', desc:'You have a religious creed, and while it may not mesh well with those of the Frontier Galaxy, your ideology may drive the narrative.', triggers: ['Someone rejects your faith', 'Your faith compels you to take some foolish action', 'You bend a core tenet of your faith'] },
  { type:'trouble', name:'In Too Deep', desc:'You got involved with the wrong people and did things you aren\'t proud of.', triggers: ['You answer one of the questions during play', 'A lawman remembers your face', 'Which point did you realise you\'d gone too far'] },
  { type:'trouble', name:'Lost It All on the River', desc:'You gotta play the hand that life gives you. You love to gamble, and you never fold.', triggers: ['You go all in and live to regret it', 'You make an outrageous bluff', 'You defy the odds and win big'] },
  { type:'trouble', name:'Lovesick', desc:'You had a lover, but now they\'re gone. It doesn\'t feel all that good.', triggers: ['Something reminds you of them and it stings a bit', 'Something reminds you of them and makes you miss them so much', 'Something reminds you of them and makes you feel empty'] },
  { type:'trouble', name:'On the Run', desc:'You crossed someone you shouldn\'t have. Fled like a dog.', triggers: ['You abandon someone to escape', 'You see your pursuers when they are not there', 'You evade a problem instead of fighting it'] },
  { type:'trouble', name:'Orbital Blues', desc:'Everyone else is fighting the battle to be ruthless. Everyone else is tightening the noose. You just want to not lose, but you still last.', triggers: ['What caused the onset of the blues', 'What do you enjoy before the blues bed each day', 'How do you cope with the blues', 'Who helps you through the blues', 'You see someone enjoying something the blues have spoiled for you'] },
  { type:'trouble', name:'Papa Was a Rolling Stone', desc:'Perhaps Dad was the highest roller this side of Rancid Vegas, or Ma was the best Bounty Hunter who ever held a .45. Whatever it was, you will always and forever live in their shadow.', triggers: ['Your forebear\'s reputation undermines your achievements', 'Your abilities are doubted against your predecessor\'s', 'Your abilities or achievements are compared to theirs'] },
  { type:'trouble', name:'Party Animal', desc:'You know how to live. Let no one else tell you anything else.', triggers: ['You enjoy yourself more than you probably should', 'You do a very stupid thing in a very serious situation', 'You cover up your true feelings with debauchery'] },
  { type:'trouble', name:'Reluctant Vagabond', desc:'You had a nice life somewhere, or at least something comfortable. Something that eats you up inside. You miss it.', triggers: ['You remember what you left behind', 'You see others living comfortable, stable lives', 'You complain about your new life'] },
  { type:'trouble', name:'The Road Not Taken', desc:'Something has passed you by, and you can\'t stop thinking about it. Something that was stopping you from changing your mind now.', triggers: ['You are reminded of the path you left behind', 'You think of the path you left behind', 'You unsuccessfully attempt to change your chosen path'] },
  { type:'trouble', name:'Struggling Artist', desc:'You\'re an artist. One day they\'ll recognise you.', triggers: ['You rely on your talent', 'Something reminds you of your failure', 'Someone comments on your talent'] },
  { type:'trouble', name:'Too Big for Your Boots', desc:'You are the best at something, and you know it. God help anyone who tells you otherwise.', triggers: ['You list your accomplishments', 'You put others down', 'You fail to prove your superiority'] },
  { type:'trouble', name:'Through Your Teeth', desc:'You\'ve never found an honest benefit you liked — but the truth has a way of coming back.', triggers: ['You accidentally reveal something you shouldn\'t', 'Something reminds you of your cell or cellmates', 'You use a skill you learned while you were inside'] },
  { type:'trouble', name:'Time Behind Bars', desc:'You spent some time in prison for crimes you may have committed. You are out now, but it\'s still with you.', triggers: ['Where did you serve your sentence', 'What uncommon skill did you learn while inside', 'What friends did you make while inside', 'What enemies did you make while inside', 'How long was it'] },
  { type:'trouble', name:'Yellow-Bellied', desc:'They called you a coward. Worst is, they aren\'t wrong.', triggers: ['You bottle it up', 'Someone calls you a coward, and they\'re right', 'You ruminate on the worst thing that could happen in this situation'] },
];

let tab = 'all';

function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(el => {
    const label = el.textContent.toLowerCase();
    el.classList.toggle('active', t === 'all' ? label === 'all' : label === t + 's');
  });
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = DATA.filter(d => {
    if (tab !== 'all' && d.type !== tab) return false;
    if (!q) return true;
    return d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || (d.triggers || []).join(' ').toLowerCase().includes(q);
  });
  document.getElementById('count').textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''}`;
  const grid = document.getElementById('grid');
  if (!filtered.length) { grid.innerHTML = '<div class="none">No matches found.</div>'; return; }
  grid.innerHTML = filtered.map(d => `
    <div class="card">
      <div class="tag tag-${d.type}">${d.type}</div>
      <div class="card-name">${d.name}</div>
      <div class="card-body">${d.desc}</div>
      ${d.triggers ? `<div class="trigger"><strong>Gain 1 Blues when:</strong> ${d.triggers.join(' · ')}</div>` : ''}
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
